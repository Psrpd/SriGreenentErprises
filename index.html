<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sri Green Enterprises – Billing</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --brand:#1078f0;
  --accent:#10b981;
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#64748b;
  --border:#e5e7eb;
  --danger:#ef4444;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  text-align:center;
  padding:20px;
  background:#fff;
  border-bottom:2px solid var(--border);
}
header h1{margin:0;color:#16a34a;font-size:1.8rem}
header p{margin:6px 0 0;color:var(--muted)}

/* CONTAINER */
.container{
  max-width:1100px;
  margin:15px auto;
  background:#fff;
  padding:20px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
.field label{font-weight:600;font-size:.9rem}
input,select{
  width:100%;
  padding:10px;
  margin-top:4px;
  border:1px solid var(--border);
  border-radius:8px;
}

/* TABLE */
.table-wrap{overflow-x:auto}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border-bottom:1px solid var(--border);
  padding:10px;
  text-align:center;
}
th{background:#eef6ff}
.lineTotal{font-weight:700;color:#0f766e}

/* BUTTONS */
.toolbar{
  display:flex;
  gap:10px;
  margin:15px 0;
  flex-wrap:wrap;
}
button{
  padding:10px 16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}
.add{background:var(--brand);color:#fff}
.calc{background:var(--accent);color:#033}
.print{background:#f59e0b}
.remove{background:transparent;color:var(--danger);border:1px solid var(--danger)}

/* SUMMARY */
.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
.card{
  border:1px solid var(--border);
  padding:15px;
  border-radius:12px;
}

/* RESPONSIVE */
@media(max-width:768px){
  .grid{grid-template-columns:1fr}
  .summary{grid-template-columns:1fr}
  .toolbar{flex-direction:column}
  button{width:100%}
  header h1{font-size:1.4rem}
}

/* PRINT */
@media print{
  body{background:#fff}
  .toolbar,.summary input,.summary select{display:none}
}
</style>
</head>

<body>

<header>
  <h1>Sri Green Enterprises</h1>
  <p>Electric & Hardware Shop Billing (Wire billed per meter)</p>
</header>

<div class="container">

<!-- CUSTOMER -->
<div class="grid">
  <div class="field">
    <label>Customer Name</label>
    <input id="custName">
  </div>
  <div class="field">
    <label>Customer Email</label>
    <input id="custEmail">
  </div>
  <div class="field">
    <label>Invoice No</label>
    <input id="invoiceNo" readonly>
  </div>
  <div class="field">
    <label>Invoice Date</label>
    <input id="invoiceDate" readonly>
  </div>
</div>

<!-- ITEMS -->
<div class="table-wrap">
<table id="billTable">
<thead>
<tr>
  <th>Item</th>
  <th>Price ₹</th>
  <th>Qty</th>
  <th>Wire (meter)</th>
  <th>Total ₹</th>
  <th>Action</th>
</tr>
</thead>
<tbody>
<tr>
<td>
<select class="item">
  <option value="">Select</option>
  <option>LED Bulb</option>
  <option>Tube Light</option>
  <option>Switch Board</option>
  <option>Fan</option>
  <option>MCB</option>
  <option>Socket</option>
  <option>Extension Board</option>
  <option>Hammer</option>
  <option>Pliers</option>
  <option>Screwdriver</option>
  <option>Electric Wire</option>
  <option>Custom Item</option>
</select>
</td>
<td><input type="number" class="price"></td>
<td><input type="number" class="qty" value="1"></td>
<td><select class="meter" style="display:none"></select></td>
<td class="lineTotal">0.00</td>
<td><button class="remove">Remove</button></td>
</tr>
</tbody>
</table>
</div>

<div class="toolbar">
  <button class="add" id="addRow">Add Item</button>
  <button class="calc" id="calc">Calculate</button>
  <button class="print" id="print">Print Receipt</button>
</div>

<div class="summary">
<div class="card">
  <label><input type="checkbox" id="gstCheck"> Apply GST</label><br><br>
  <label>GST %</label>
  <select id="gstRate">
    <option value="0">0%</option>
    <option value="5">5%</option>
    <option value="12">12%</option>
    <option value="18" selected>18%</option>
    <option value="28">28%</option>
  </select>
</div>

<div class="card">
  <p>Subtotal: <span id="subTotal">₹0.00</span></p>
  <p>GST: <span id="gstAmount">₹0.00</span></p>
  <h3>Grand Total: <span id="grandTotal">₹0.00</span></h3>
</div>
</div>

<div class="card" id="receipt" style="margin-top:15px"></div>

</div>

<script>
invoiceNo.value="SGE-"+Math.floor(1000+Math.random()*9000);
invoiceDate.value=new Date().toLocaleString();

function fillMeter(sel){
  sel.innerHTML='<option value="0">Select</option>';
  for(let i=1;i<=25;i++) sel.innerHTML+=`<option value="${i}">${i} meter</option>`;
}

function attach(row){
  const item=row.querySelector(".item");
  const price=row.querySelector(".price");
  const qty=row.querySelector(".qty");
  const meter=row.querySelector(".meter");
  const total=row.querySelector(".lineTotal");

  fillMeter(meter);

  function calcLine(){
    let q=item.value==="Electric Wire"?Number(meter.value):Number(qty.value);
    total.textContent=(Number(price.value||0)*q).toFixed(2);
    calcBill();
  }

  item.onchange=()=>{
    if(item.value==="Electric Wire"){
      qty.disabled=true; qty.value=0;
      meter.style.display="block";
    }else{
      qty.disabled=false;
      meter.style.display="none";
      meter.value=0;
    }
    calcLine();
  };

  price.oninput=qty.oninput=meter.onchange=calcLine;
  row.querySelector(".remove").onclick=()=>{row.remove();calcBill();}
}

attach(document.querySelector("tbody tr"));

addRow.onclick=()=>{
  const r=document.querySelector("tbody tr").cloneNode(true);
  r.querySelectorAll("input").forEach(i=>i.value=0);
  r.querySelector(".lineTotal").textContent="0.00";
  document.querySelector("tbody").appendChild(r);
  attach(r);
};

function calcBill(){
  let subtotal=0;
  document.querySelectorAll(".lineTotal").forEach(t=>subtotal+=Number(t.textContent));
  let gst=gstCheck.checked?subtotal*Number(gstRate.value)/100:0;
  let grand=subtotal+gst;

  subTotal.textContent="₹"+subtotal.toFixed(2);
  gstAmount.textContent="₹"+gst.toFixed(2);
  grandTotal.textContent="₹"+grand.toFixed(2);

  receipt.innerHTML=
    `<strong>Receipt</strong><br>
     Invoice: ${invoiceNo.value}<br>
     Date: ${invoiceDate.value}<br>
     Customer: ${custName.value || "Customer"}<br><br>
     <strong>Total Payable: ₹${grand.toFixed(2)}</strong>`;
}

calc.onclick=calcBill;
print.onclick=()=>window.print();
</script>

</body>
</html>
